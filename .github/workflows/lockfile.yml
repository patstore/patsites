name: Lockfile

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-lockfile:
    name: pnpm install --frozen-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install with a frozen lockfile
        run: pnpm install --frozen-lockfile
